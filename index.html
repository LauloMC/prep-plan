<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5E42">
<title>FGE-R — carnet d'entraînement</title>
<style>
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --ink:#1C2420; --muted:#66706A; --line:#D9DED8;
  --accent:#2E5E42; --accent-ink:#FFFFFF; --soft:#E3EBE4; --signal:#C9501B; --signal-soft:#F7E3D8;
  --done:#2E5E42; --test:#5A4A8A; --test-soft:#E9E4F3; --hyrox:#6B7570; --hyrox-soft:#E8EAE7;
  --radius:10px; --pad:16px;
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15201B; --surface:#1E2B25; --ink:#E8ECE7; --muted:#9AA69F; --line:#2F3D36;
    --accent:#7FB58F; --accent-ink:#0F1A14; --soft:#243730; --signal:#F0803A; --signal-soft:#3A2518;
    --done:#7FB58F; --test:#B3A3E0; --test-soft:#2A2440; --hyrox:#9AA69F; --hyrox-soft:#273029;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.45 -apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none !important}

/* header */
header{padding:calc(14px + env(safe-area-inset-top,0px)) var(--pad) 12px;background:var(--accent);color:var(--accent-ink)}
header .wk{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1}
header .wk small{font-size:17px;font-weight:600;letter-spacing:0;margin-left:10px;opacity:.9}
header .sub{margin-top:6px;font-size:15px;opacity:.9}
header .count{margin-top:4px;font-size:14px;opacity:.85}
.wknav{display:flex;gap:8px;align-items:center;margin-top:10px}
.wknav button{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:8px;padding:8px 14px;font-weight:600}
.wknav .spacer{flex:1}

main{padding:var(--pad)}
h2{font-size:22px;margin:0 0 10px;font-weight:700}
h3{font-size:18px;margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}

/* summary */
.summary{border-left:5px solid var(--accent);padding-left:12px;margin:0 0 16px}
.summary p{margin:2px 0;font-size:16px}

/* day list */
.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.dayrow .d{width:46px;font-weight:700;flex:none}
.dayrow .d small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.dayrow .t{flex:1}
.dayrow .t small{display:block;color:var(--muted);font-size:14px}
.dayrow.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dayrow .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:700}
.dayrow .st.done{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.dayrow .st.skip{border-color:var(--signal);color:var(--signal)}
.dayrow.hyrox .d{color:var(--hyrox)}
.dayrow.test .d{color:var(--test)}

/* session */
.sess-head{margin-bottom:12px}
.sess-head .title{font-size:24px;font-weight:800;line-height:1.15}
.sess-head .meta{color:var(--muted);margin-top:4px}
.block{margin:16px 0 8px}
.block h4{margin:0 0 6px;padding:8px 12px;background:var(--soft);border-left:5px solid var(--accent);border-radius:0 8px 8px 0;font-size:17px}
.exrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.exrow .name{font-weight:600;display:flex;gap:8px;align-items:flex-start}
.exrow .name button.info{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);font-size:14px;font-weight:700;line-height:1;margin-top:1px}
.exrow .sets{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;grid-column:1;}
.exrow .rest{grid-column:2;grid-row:1 / span 3;align-self:start;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.exrow .rest button{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.exrow .rest .chk{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px}
.exrow .rest .chk.on{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.exrow .note{grid-column:1;color:var(--muted);font-size:15px}
.notes li{margin:4px 0}

/* forms */
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:15px;color:var(--muted)}
.form input,.form select,.form textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px}
.form textarea{min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-block;border:0;background:var(--accent);color:var(--accent-ink);padding:12px 18px;border-radius:10px;font-weight:700;font-size:17px;width:100%;text-align:center}
.btn.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn.warn{background:transparent;border:1.5px solid var(--signal);color:var(--signal)}
.btn.small{width:auto;padding:8px 14px;font-size:15px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--signal);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;z-index:5}
#timer .big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#timer .lbl{flex:1;font-weight:600}
#timer button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:8px;padding:10px 14px;font-weight:700}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:transparent;padding:10px 2px 8px;font-size:12.5px;color:var(--muted);display:grid;gap:2px;justify-items:center}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px var(--pad) calc(24px + env(safe-area-inset-bottom,0px));z-index:11;transform:translateY(100%);transition:transform .22s}
.sheet.open{transform:none}
.sheet h3{margin-top:0;font-size:21px}
.sheet .cues li{margin:4px 0}
.sheet .close{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.gl-item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;font-weight:600}
.gl-item small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>

<div id="timer" class="hidden">
  <div class="big" id="tbig">0:00</div>
  <div class="lbl" id="tlbl">Repos</div>
  <button id="tplus">+30 s</button>
  <button id="tstop">Stop</button>
</div>

<nav>
  <button data-v="today" class="on"><span class="ic">▣</span>Aujourd'hui</button>
  <button data-v="week"><span class="ic">☰</span>Semaine</button>
  <button data-v="tests"><span class="ic">◎</span>Tests</button>
  <button data-v="weight"><span class="ic">⚖</span>Poids</button>
  <button data-v="more"><span class="ic">…</span>Plus</button>
</nav>

<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"><button class="close" id="sheetclose" aria-label="Fermer">✕</button><div id="sheetbody"></div></div>
<div class="toast" id="toast"></div>

  "touch": {

   "how": "Planche haute, pieds écartés largeur hanches, gilet lesté. Toucher l'épaule gauche avec la main droite, reposer, puis l'inverse, sans que le bassin bouge.",
   "cues": [
    "Bassin immobile : c'est le but",
    "Rythme régulier",
    "Pieds plus écartés = plus facile"
   ],
   "why": "Gainage anti-rotation + stabilité d'épaule sur un bras."
  },
  "plank": {
   "name": "Planche",
   "how": "Avant-bras au sol, coudes sous les épaules, corps en ligne de la tête aux talons. Tenir.",
   "cues": [
    "Fessiers serrés",
    "Pas de cambrure, pas de fesses en l'air",
    "Arrêter quand le bassin descend"
   ],
   "why": "Référence de gainage ; avec gilet à partir du bloc 3."
  },
  "ytw": {
   "name": "Y-T-W",
   "how": "Allongée sur le ventre, front au sol. Lever les bras tendus en Y (vers l'avant en diagonale), tenir 1 s ; puis en T (sur les côtés) ; puis en W (coudes pliés). 1 kg maximum dans les mains.",
   "cues": [
    "Pouces vers le ciel",
    "Décoller les bras, pas la poitrine",
    "Léger : c'est du contrôle"
   ],
   "why": "Muscles profonds de l'épaule et du haut du dos ; prévention des douleurs sous sangles."
  },
  "superman": {
   "name": "Superman",
   "how": "Allongée sur le ventre, bras devant. Décoller simultanément bras et jambes, tenir 2 s, reposer.",
   "cues": [
    "Regard au sol, nuque longue",
    "Mouvement de quelques cm",
    "Pas de blocage de respiration"
   ],
   "why": "Lombaires et fessiers : protègent le bas du dos sous charge."
  },
  "deadbug": {
   "name": "Dead bug",
   "how": "Allongée sur le dos, bras vers le plafond, hanches et genoux à 90°. Allonger lentement une jambe et le bras opposé, bas du dos plaqué au sol, revenir.",
   "cues": [
    "Lombaires collées au sol tout le temps",
    "Lent",
    "Expirer en allongeant"
   ],
   "why": "Gainage profond, coordination."
  },
  "walk": {
   "name": "Marche avec sac",
   "how": "Sac réglé : charge dense, haute et contre le dos ; sangles serrées ; ceinture ventrale serrée si le sac en a une. Marcher à allure soutenue mais tenable (5,5–6 km/h sur plat).",
   "cues": [
    "Pas courts en montée",
    "Au premier point chaud au pied : s'arrêter et taper",
    "Fourmillements dans les bras = desserrer immédiatement"
   ],
   "why": "C'est l'entraînement le plus spécifique du plan. Charge et distance n'augmentent jamais la même semaine. Rangers à partir de S6."
  },
  "arm_hold": {
   "name": "Tenue « arme » bras tendus",
   "how": "Objet de 3,6 kg tenu à deux mains, bras tendus devant à hauteur d'épaules. Tenir le plus longtemps possible sans que les mains passent sous la ligne des épaules.",
   "cues": [
    "Épaules basses",
    "Abdos serrés, pas de cambrure",
    "Chrono"
   ],
   "why": "Cible : 60–90 s. Mesure la fatigue d'épaule spécifique au port de l'arme."
  },
  "stretch": {
   "name": "Étirements",
   "how": "Pectoraux : avant-bras contre un cadre de porte, avancer le buste. Dorsaux : suspension passive à la barre. Mollets : talon au sol, jambe arrière tendue, puis genou fléchi. Ischios : jambe tendue sur une marche.",
   "cues": [
    "30 s par position",
    "Respiration lente",
    "Pas de douleur vive"
   ],
   "why": "Retour au calme ; pas d'effet prouvé sur les courbatures, utile pour la mobilité."
  },
  "calf": {
   "name": "Mollets et tibial antérieur",
   "how": "Montées sur pointes : sur une marche, monter sur la pointe des pieds, descendre talon sous le niveau de la marche. Relevés de pointes : dos au mur, talons au sol, relever les orteils vers soi.",
   "cues": [
    "Lent en descente",
    "Amplitude complète",
    "2× par semaine dès S5"
   ],
   "why": "Prévention de la périostite tibiale, fréquente au début du port de charge en rangers."
  },
  "hyrox": {
   "name": "Hyrox",
   "how": "Séance en salle, inchangée. Rien d'autre ce jour-là.",
   "cues": [
    "Repas 1–2 h avant : ~50 g de glucides",
    "Whey 25–30 g + glucides dans les 2 h après"
   ],
   "why": "Reste à 2× par semaine pendant tout le plan."
  },
  "ggt": {
   "name": "Pompes du matin (facultatif)",
   "how": "2 séries de 6 pompes faciles, loin de l'échec, 2 min de repos. Sauter si fatigue ou si l'Hyrox est le matin.",
   "cues": [
    "Jamais à l'échec",
    "Technique parfaite"
   ],
   "why": "Pratique de fréquence : plus de répétitions de qualité dans la semaine sans fatigue."
  },
  "test_pull": {
   "name": "Test tractions",
   "how": "Après échauffement : une seule série maximale de tractions strictes (pronation, menton au-dessus, bras tendus en bas).",
   "cues": [
    "Repos 4 min avant le test suivant"
   ],
   "why": "Même protocole à chaque test (S4, S8, S12, S16, S20, S24)."
  },
  "test_push": {
   "name": "Test pompes",
   "how": "Une série maximale de pompes strictes menton au sol, sans pause de plus de 2 s.",
   "cues": [],
   "why": "Référence de départ : 11."
  },
  "test_walk": {
   "name": "Test marche",
   "how": "Même parcours plat à chaque test, allure soutenue mais tenable. Noter le temps, le ressenti épaules/nuque/pieds juste après, et les courbatures le lendemain matin.",
   "cues": [
    "Ne pas courir",
    "Rangers dès le test S8"
   ],
   "why": "Sert à calibrer le bloc suivant."
  },
  "weigh": {
   "name": "Pesée",
   "how": "Le matin, après les toilettes, avant de manger, 2–3 fois par semaine. Noter la moyenne de la semaine, pas une pesée isolée.",
   "cues": [],
   "why": "Cible : +0,10–0,15 kg par semaine en moyenne."
  }
 },
 "tests": [
  "Tractions strictes (reps)",
  "Pompes strictes (reps)",
  "Suspension (s)",
  "Tenue arme 3,6 kg (s)",
  "Touchers d'épaules 30 s (nb)",
  "Planche (s)",
  "Marche test (km)",
  "Marche test (sac kg)",
  "Marche test (temps min)",
  "Épaules après marche (0–10)",
  "Pieds (0–10)"
 ]
}</script>
<script>
(function(){
'use strict';
const BUILTIN = JSON.parse(document.getElementById('plan-data').textContent);
const LS_LOG = 'fge.log.v1', LS_PLAN = 'fge.plan.v1';
let PLAN = BUILTIN;
try{ const o = localStorage.getItem(LS_PLAN); if(o){ const p = JSON.parse(o); if(p && p.weeks) PLAN = p; } }catch(e){}
let LOG = {sessions:{}, tests:[], weights:[]};
try{ const s = localStorage.getItem(LS_LOG); if(s){ LOG = Object.assign(LOG, JSON.parse(s)); } }catch(e){}
function save(){ try{ localStorage.setItem(LS_LOG, JSON.stringify(LOG)); }catch(e){ toast('Sauvegarde impossible (stockage plein ou bloqué)'); } }

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => d.toISOString().slice(0,10);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtD = s => { const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); };
const weeks = PLAN.weeks;
function weekFor(dateStr){ return weeks.find(w => dateStr >= w.start && dateStr <= w.end); }
function currentWeekNum(){ const w = weekFor(todayISO()); if(w) return w.num; return todayISO() < weeks[0].start ? 1 : weeks.length; }
function dayOf(dateStr){ const w = weekFor(dateStr); if(!w) return null; return w.days.find(d => d.date===dateStr); }
const isSession = d => d && !['rest','event'].includes(d.type);
const daysToStage = () => Math.round((new Date(PLAN.stage.start+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/864e5);

let state = {view:'today', week: currentWeekNum(), date: todayISO()};

// ---------- toast ----------
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ---------- timer ----------
let tEnd=0, tInt=null, actx=null;
function beep(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.connect(g); g.connect(actx.destination); o.frequency.value=880; g.gain.value=.25; o.start(); setTimeout(()=>{o.stop();},350);}catch(e){} if(navigator.vibrate) navigator.vibrate([200,100,200]); }
function parseRest(s){ const m = String(s).match(/(\d+)\s*min(?:\s*(\d+))?|(\d+)\s*s/); if(!m) return 0; if(m[1]) return +m[1]*60 + (m[2]?+m[2]:0); return +m[3]; }
function startTimer(sec,label){ if(!sec) return; tEnd = Date.now()+sec*1000; $('#tlbl').textContent = label||'Repos'; $('#timer').classList.remove('hidden'); clearInterval(tInt); tick(); tInt=setInterval(tick,250); }
function tick(){ const r = Math.max(0, Math.ceil((tEnd-Date.now())/1000)); $('#tbig').textContent = Math.floor(r/60)+':'+String(r%60).padStart(2,'0'); if(r<=0){ clearInterval(tInt); beep(); setTimeout(()=>$('#timer').classList.add('hidden'),1500);} }
$('#tstop').onclick = ()=>{ clearInterval(tInt); $('#timer').classList.add('hidden'); };
$('#tplus').onclick = ()=>{ tEnd += 30000; tick(); };

// ---------- sheet ----------
function openSheet(html){ $('#sheetbody').innerHTML = html; $('#sheet').classList.add('open'); $('#sheetbg').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheetbg').classList.remove('open'); }
$('#sheetbg').onclick = closeSheet; $('#sheetclose').onclick = closeSheet;
function showEx(id){ const g = PLAN.glossary[id]; if(!g){ openSheet('<h3>Pas de fiche</h3><p class="muted">Cet exercice n\'a pas encore de fiche explicative.</p>'); return; }
  openSheet(`<h3>${esc(g.name)}</h3><p>${esc(g.how)}</p>${g.cues&&g.cues.length?'<h4>Consignes</h4><ul class="cues">'+g.cues.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':''}<p class="muted">${esc(g.why)}</p>`); }

// ---------- summary ----------
function weekStats(w){ const planned = w.days.filter(isSession); let done=0, km=0, skipped=0; planned.forEach(d=>{ const l=LOG.sessions[d.date]; if(l&&l.status==='done'){done++; km+= +l.km||0;} if(l&&l.status==='skip') skipped++; });
  const ws = weightsBetween(w.start,w.end), prev = weeks[w.num-2] ? weightsBetween(weeks[w.num-2].start, weeks[w.num-2].end) : [];
  const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
  return {planned:planned.length, done, skipped, km, wavg:avg(ws), pavg:avg(prev)}; }
function weightsBetween(a,b){ return LOG.weights.filter(x=>x.date>=a&&x.date<=b).map(x=>+x.kg); }
function lastTest(){ const t = LOG.tests.slice().sort((a,b)=>a.date<b.date?1:-1)[0]; return t||null; }
function summaryHTML(w){ const s = weekStats(w); const kmTxt = s.km ? `, ${s.km.toLocaleString('fr-FR')} km marchés` : '';
  const l1 = `S${w.num} : ${s.done}/${s.planned} séances faites${s.skipped?` (${s.skipped} sautée${s.skipped>1?'s':''})`:''}${kmTxt}.`;
  let l2 = s.wavg ? `Poids moyen ${s.wavg.toFixed(1)} kg` + (s.pavg ? ` (${(s.wavg-s.pavg>=0?'+':'')}${(s.wavg-s.pavg).toFixed(1)} vs semaine précédente)` : '') : 'Pas de pesée cette semaine';
  const t = lastTest(); if(t){ const v=t.values||{}; l2 += `. Dernier test S${t.week} : ${v['Tractions strictes (reps)']||'–'} tractions, ${v['Pompes strictes (reps)']||'–'} pompes.`; } else l2 += '. Aucun test enregistré.';
  return `<div class="summary"><p>${esc(l1)}</p><p>${esc(l2)}</p></div>`; }

// ---------- header ----------
function renderHeader(){ const w = weeks[state.week-1]; const d = daysToStage();
  $('#hdr').innerHTML = `<div class="wk">S${String(w.num).padStart(2,'0')}<small>${esc(w.label)}</small></div><div class="sub">${esc(w.bloc)} — ${esc(w.goal)}</div><div class="count">${d>0?`J−${d} avant le départ`:(d>=-16?'Stage en cours':'Stage terminé')}${w.test?' · '+esc(w.test):''}</div>
  <div class="wknav"><button data-w="-1">‹ Sem.</button><button data-w="0">Cette semaine</button><button data-w="1">Sem. ›</button><span class="spacer"></span></div>`;
  $('#hdr').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.w; state.week = k===0 ? currentWeekNum() : Math.min(weeks.length, Math.max(1, state.week+k)); if(state.view==='session') state.view='week'; render(); }); }

// ---------- views ----------
function dayRow(d){ const l = LOG.sessions[d.date]||{}; const st = l.status==='done'?'done':(l.status==='skip'?'skip':''); const isT = d.date===todayISO();
  const cls = ['dayrow', d.type, isT?'today':''].join(' ');
  const sub = d.type==='rest' ? 'Repos' : (d.duration||'');
  return `<button class="${cls}" data-date="${d.date}"><span class="d">${esc(d.day.slice(0,3))}<small>${esc(fmtD(d.date))}</small></span><span class="t">${esc(d.title)}<small>${esc(sub)}</small></span><span class="st ${st}">${st==='done'?'✓':(st==='skip'?'–':'')}</span></button>`; }

function viewToday(){ const w = weekFor(todayISO()); const cur = weeks[state.week-1];
  if(!w){ return `<h2>Hors plan</h2><p class="muted">Le plan commence le ${esc(fmtD(weeks[0].start))} 2026 et finit le ${esc(fmtD(weeks[weeks.length-1].end))} 2027.</p>`+viewWeek(); }
  if(state.week!==w.num) return viewWeek();
  const d = dayOf(todayISO());
  return summaryHTML(w) + `<h2>Aujourd'hui</h2>` + dayRow(d) + `<h3>Reste de la semaine</h3>` + w.days.filter(x=>x.date!==todayISO()).map(dayRow).join(''); }

function viewWeek(){ const w = weeks[state.week-1]; return summaryHTML(w) + `<h2>Semaine</h2>` + (w.detailed?'':'<p class="muted">Semaine en structure : les fiches détaillées seront générées à la mise à jour du plan.</p>') + w.days.map(dayRow).join(''); }

function viewSession(){ const d = dayOf(state.date); if(!d) return '<p>Jour introuvable.</p>'; const l = LOG.sessions[d.date] || {items:{}}; l.items = l.items||{};
  let h = `<button class="btn ghost small" data-back="1">‹ Semaine</button><div class="sess-head" style="margin-top:12px"><div class="title">${esc(d.day)} — ${esc(d.title)}</div><div class="meta">${esc(fmtD(d.date))}${d.duration?' · '+esc(d.duration):''}</div><p>${esc(d.goal)}</p></div>`;
  let idx=0;
  d.blocks.forEach(b=>{ h += `<div class="block"><h4>${esc(b.title)}</h4>`; b.items.forEach(it=>{ const i=idx++; const r=parseRest(it.rest); const on = l.items[i] ? 'on':'';
    h += `<div class="exrow"><div class="name"><button class="info" data-ex="${esc(it.id)}" aria-label="Explication">i</button><span>${esc(it.ex)}</span></div><div class="rest">${r?`<button data-rest="${r}" data-lbl="${esc(it.ex)}">⏱ ${esc(it.rest)}</button>`:''}<button class="chk ${on}" data-chk="${i}" aria-label="Fait">${on?'✓':''}</button></div><div class="sets">${esc(it.sets)}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}</div>`; }); h += '</div>'; });
  if(d.notes&&d.notes.length) h += '<h3>Notes</h3><ul class="notes">'+d.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>';
  const isWalk = d.type==='walk' || d.type==='test';
  h += `<h3>Bilan de la séance</h3><div class="card form">
    <div class="seg" id="status"><button data-s="done" class="${l.status==='done'?'on':''}">Faite</button><button data-s="skip" class="${l.status==='skip'?'on':''}">Sautée</button><button data-s="" class="${!l.status?'on':''}">—</button></div>
    <div class="row2"><label>Effort ressenti (1–10)<input type="number" inputmode="numeric" min="1" max="10" id="rpe" value="${l.rpe||''}"></label><label>Durée réelle (min)<input type="number" inputmode="numeric" id="dur" value="${l.dur||''}"></label></div>
    ${true?`<div class="row2"><label>Km marchés<input type="number" inputmode="decimal" step="0.1" id="km" value="${l.km||''}"></label><label>Charge sac (kg)<input type="number" inputmode="decimal" step="0.5" id="kg" value="${l.kg||''}"></label></div>`:''}
    <label>Notes (charges, reps, douleurs, pieds, sommeil)<textarea id="note">${esc(l.note||'')}</textarea></label>
    <button class="btn" id="savesess">Enregistrer</button></div>`;
  return h; }

function viewTests(){ const w = weeks[state.week-1]; const t = LOG.tests.find(x=>x.week===w.num) || {week:w.num, date:todayISO(), values:{}};
  let h = `<h2>Tests</h2><p class="muted">Un test toutes les 4 semaines (S4, S8, S12, S16, S20, S24). Remplir seulement les lignes mesurées.</p><div class="card form"><div class="row2"><label>Semaine<input type="number" id="tweek" value="${t.week}"></label><label>Date<input type="date" id="tdate" value="${t.date}"></label></div>`;
  PLAN.tests.forEach((name,i)=>{ h += `<label>${esc(name)}<input type="number" inputmode="decimal" step="0.5" data-t="${esc(name)}" value="${t.values[name]!=null?t.values[name]:''}"></label>`; });
  h += `<button class="btn" id="savetest">Enregistrer le test</button></div>`;
  const hist = LOG.tests.slice().sort((a,b)=>a.week-b.week);
  if(hist.length){ h += '<h3>Historique</h3><div class="scroll"><table><tr><th>Mesure</th>'+hist.map(x=>`<th>S${x.week}</th>`).join('')+'</tr>';
    PLAN.tests.forEach(name=>{ h += `<tr><td>${esc(name)}</td>`+hist.map(x=>`<td>${x.values[name]!=null?esc(x.values[name]):'–'}</td>`).join('')+'</tr>'; }); h += '</table></div>'; }
  return h; }

function viewWeight(){ const ws = LOG.weights.slice().sort((a,b)=>a.date<b.date?1:-1); const last7 = ws.filter(x=>x.date >= iso(new Date(Date.now()-6*864e5))).map(x=>+x.kg); const avg = last7.length? (last7.reduce((a,b)=>a+b,0)/last7.length):null;
  let h = `<h2>Poids</h2><div class="card form"><div class="row2"><label>Date<input type="date" id="wdate" value="${todayISO()}"></label><label>Poids (kg)<input type="number" inputmode="decimal" step="0.1" id="wkg"></label></div><button class="btn" id="savew">Enregistrer</button></div>`;
  h += `<div class="summary"><p>Moyenne 7 jours : ${avg?avg.toFixed(1)+' kg':'–'}</p><p class="muted">Cible : +0,10 à 0,15 kg par semaine en moyenne. Juger sur 3 semaines, pas sur une pesée.</p></div>`;
  if(ws.length) h += '<table><tr><th>Date</th><th>kg</th><th></th></tr>'+ws.slice(0,30).map((x,i)=>`<tr><td>${esc(fmtD(x.date))}</td><td>${esc(x.kg)}</td><td><button class="btn ghost small" data-delw="${esc(x.date)}">×</button></td></tr>`).join('')+'</table>';
  return h; }

function viewMore(){ const ids = Object.keys(PLAN.glossary).sort((a,b)=>PLAN.glossary[a].name.localeCompare(PLAN.glossary[b].name,'fr'));
  return `<h2>Données</h2><div class="card form">
    <button class="btn" id="export">Exporter mes données (JSON)</button>
    <label>Importer des données<input type="file" accept=".json,application/json" id="import"></label>
    <label>Charger un nouveau plan (plan.json)<input type="file" accept=".json,application/json" id="loadplan"></label>
    <p class="muted">Plan actuel : version ${esc(PLAN.version)}${PLAN!==BUILTIN?' (chargé)':' (intégré)'}. Données : ${Object.keys(LOG.sessions).length} séances, ${LOG.tests.length} tests, ${LOG.weights.length} pesées.</p>
    <button class="btn warn" id="resetplan">Revenir au plan intégré</button>
    <button class="btn warn" id="reset">Effacer toutes mes données</button></div>
    <h2>Fiches exercices</h2>` + ids.map(id=>`<button class="gl-item" data-ex="${esc(id)}">${esc(PLAN.glossary[id].name)}<small>${esc(PLAN.glossary[id].how.slice(0,90))}…</small></button>`).join(''); }

// ---------- render ----------
function render(){ renderHeader(); const v = $('#view');
  v.innerHTML = {today:viewToday, week:viewWeek, session:viewSession, tests:viewTests, weight:viewWeight, more:viewMore}[state.view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===state.view || (state.view==='session'&&b.dataset.v==='week')));
  window.scrollTo(0,0); bind(); }

function bind(){ const v = $('#view');
  v.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{ const d = dayOf(b.dataset.date); if(!d || d.type==='rest' && !d.blocks.length) { if(d) toggleRest(d); return; } state.date=b.dataset.date; state.view='session'; render(); });
  v.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ state.view='week'; render(); });
  v.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>showEx(b.dataset.ex));
  v.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest, b.dataset.lbl));
  v.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{ const l = LOG.sessions[state.date] = LOG.sessions[state.date]||{items:{}}; l.items=l.items||{}; const i=b.dataset.chk; l.items[i]=!l.items[i]; b.classList.toggle('on', l.items[i]); b.textContent = l.items[i]?'✓':''; save(); });
  const st = $('#status'); if(st) st.querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  const ss = $('#savesess'); if(ss) ss.onclick=()=>{ const l = LOG.sessions[state.date] = LOG.sessions[state.date]||{items:{}}; const on = st.querySelector('button.on'); l.status = on?on.dataset.s:''; if(!l.status) delete l.status;
    ['rpe','dur','km','kg'].forEach(k=>{ const e=$('#'+k); if(e) l[k]=e.value===''?undefined:+e.value; }); l.note=$('#note').value; if(l.status==='done'&&!l.date) l.date=todayISO(); save(); toast('Séance enregistrée'); state.view='week'; render(); };
  const stt = $('#savetest'); if(stt) stt.onclick=()=>{ const week=+$('#tweek').value, date=$('#tdate').value; const values={}; v.querySelectorAll('[data-t]').forEach(i=>{ if(i.value!=='') values[i.dataset.t]=+i.value; }); if(!Object.keys(values).length){ toast('Aucune valeur saisie'); return; } LOG.tests = LOG.tests.filter(x=>x.week!==week); LOG.tests.push({week,date,values}); save(); toast('Test enregistré'); render(); };
  const sw = $('#savew'); if(sw) sw.onclick=()=>{ const date=$('#wdate').value, kg=+$('#wkg').value; if(!kg||!date){ toast('Poids ou date manquant'); return; } LOG.weights = LOG.weights.filter(x=>x.date!==date); LOG.weights.push({date,kg}); save(); toast('Pesée enregistrée'); render(); };
  v.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>{ LOG.weights = LOG.weights.filter(x=>x.date!==b.dataset.delw); save(); render(); });
  const ex = $('#export'); if(ex) ex.onclick=()=>{ const out = {exported: new Date().toISOString(), planVersion: PLAN.version, log: LOG}; const blob = new Blob([JSON.stringify(out,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fge-export-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Export téléchargé'); };
  const im = $('#import'); if(im) im.onchange=()=>readJSON(im.files[0], o=>{ const l = o.log||o; if(!l.sessions){ toast('Fichier non reconnu'); return; } LOG = {sessions:l.sessions||{}, tests:l.tests||[], weights:l.weights||[]}; save(); toast('Données importées'); render(); });
  const lp = $('#loadplan'); if(lp) lp.onchange=()=>readJSON(lp.files[0], o=>{ if(!o.weeks||!o.glossary){ toast('Ce fichier n\'est pas un plan'); return; } localStorage.setItem(LS_PLAN, JSON.stringify(o)); location.reload(); });
  const rp = $('#resetplan'); if(rp) rp.onclick=()=>{ localStorage.removeItem(LS_PLAN); location.reload(); };
  const rs = $('#reset'); if(rs) rs.onclick=()=>{ if(confirm('Effacer toutes les séances, tests et pesées ? Exporte d\'abord si tu veux garder une copie.')){ LOG={sessions:{},tests:[],weights:[]}; save(); render(); } };
}
function toggleRest(d){ const l = LOG.sessions[d.date] = LOG.sessions[d.date]||{}; l.status = l.status==='done'?'':'done'; if(!l.status) delete l.status; save(); render(); }
function readJSON(f, cb){ if(!f) return; const r = new FileReader(); r.onload = ()=>{ try{ cb(JSON.parse(r.result)); }catch(e){ toast('JSON invalide'); } }; r.readAsText(f); }

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ state.view=b.dataset.v; if(b.dataset.v==='today') state.week=currentWeekNum(); render(); });
render();
})();
</script>
</body>
</html>
